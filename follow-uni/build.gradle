plugins { id 'com.android.library' }
android {
 namespace 'com.yuan.follow.uni'; compileSdk 35; buildToolsVersion '35.0.0'
 defaultConfig { minSdk 24; consumerProguardFiles 'consumer-rules.pro' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
def sdkDir=providers.gradleProperty('uniSdkDir').get()
if (!fileTree(dir:sdkDir,include:['uniapp*.aar']).files) throw new GradleException('uniSdkDir must contain the official uniapp-v8-release.aar matching HBuilderX')
dependencies {
 implementation project(':follow-core')
 compileOnly fileTree(dir:sdkDir,include:['*.aar','*.jar'])
}
