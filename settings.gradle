pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id.startsWith('com.android.')) useModule("com.android.tools.build:gradle:${requested.version}")
        }
    }
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = 'YuanFollowPlugin'
include ':follow-core', ':demo'
if (providers.gradleProperty('uniSdkDir').isPresent()) include ':follow-uni'

if (file("host-test/build.gradle").exists()) include ":host-test"
